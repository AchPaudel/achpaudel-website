version: '3.8'

services:
  # Spring Boot Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: achpaudel-backend
    ports: 
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
    depends_on:
    networks:
      - achpaudel-network
    restart: unless-stopped

  # Angular Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: achpaudel-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - achpaudel-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: achpaudel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    networks:
      - achpaudel-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: achpaudel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - achpaudel-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  achpaudel-network:
    driver: bridge 