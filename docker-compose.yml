version: '3.8'

services:
  # Spring Boot Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile.simple  # Using the simpler Dockerfile
    container_name: achpaudel-backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
    networks:
      - achpaudel-network
    restart: unless-stopped

  # Angular Frontend (built and served by Nginx)
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: achpaudel-frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - achpaudel-network
    restart: unless-stopped

networks:
  achpaudel-network:
    driver: bridge 